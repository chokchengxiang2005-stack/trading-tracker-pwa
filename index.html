<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#061225"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Trading Tracker">
  <link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css">
  <style>
    .settingsPanel{position:fixed;z-index:20;inset:0;display:flex;align-items:flex-end;width:100%;margin:0;padding:0;background:#000a;color:#edf5ff}
    .settingsPanel[hidden]{display:none!important}
    .settingsPanel form{width:min(100%,600px);margin:0 auto}
  </style>
  <title>Trading Tracker</title>
</head>
<body>
  <main class="app">
    <header><div class="brand"><b>↗</b><div><h1>Trading Tracker</h1><p>真实来源优先 · 研究信号</p></div></div><button id="settingsButton" aria-label="设置">⚙</button></header>
    <section id="status" class="status">未连接行情数据源</section><section id="quotes" class="quotes"></section><section id="news" class="news"></section>
    <section class="disclaimer"><b>信号范围</b><p>只使用报价、开盘价、1 分钟 OHLC、MACD 与相关新闻标题。它不读取订单簿、持仓、基本面或宏观数据；信号仅供研究，不会自动下单。</p></section>
  </main>
  <section id="settings" class="settingsPanel" hidden aria-hidden="true"><form id="settingsForm"><div class="handle"></div><div class="title"><div><h2>真实数据连接</h2><p>密钥只存于这台设备的浏览器本地存储。</p></div><button type="button" id="closeSettings">关闭</button></div>
    <label>股票代码（逗号分隔）<input name="symbols" placeholder="AAPL, MSFT, NVDA" required></label>
    <label>Finnhub API 密钥<input name="apiKey" type="password" required></label>
    <label>Twelve Data API 密钥（K 线备用，可选）<input name="twelveDataApiKey" type="password" placeholder="Finnhub K 线拒绝时自动使用"></label>
    <div class="twocol"><label>报价更新（秒）<input name="intervalSeconds" type="number" min="15" max="300"></label><label>大波动提醒（%）<input name="largeMovePct" type="number" min="1" max="20" step="0.1"></label></div>
    <p class="fine">K 线使用 1 分钟周期、每 30 秒刷新；优先 Finnhub，失败时改用 Twelve Data。</p><button class="save" type="submit">保存并开始追踪</button>
  </form></section>
  <script src="app.js"></script>
</body></html>
